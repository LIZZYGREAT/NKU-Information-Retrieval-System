<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南开大学信息检索系统</title>
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .home-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 70px);
            padding: 40px 20px;
        }
        .home-title {
            font-size: 42px;
            font-weight: 700;
            color: var(--primary);
            margin: 0 0 8px;
            letter-spacing: 1px;
        }
        .home-subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 36px;
        }
        .search-panel {
            background: var(--card);
            padding: 28px 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 720px;
        }
        .search-box {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }
        .search-input-wrapper { position: relative; flex: 1; min-width: 280px; }
        .search-input-wrapper .search-input { width: 100%; position: relative; z-index: 2; background: var(--card); }
        .search-ghost {
            position: absolute; left: 0; right: 0; top: 0; bottom: 0;
            padding: 12px 20px; font-size: 16px; line-height: normal;
            pointer-events: none; z-index: 1; white-space: nowrap; overflow: hidden;
            border: 1px solid transparent; border-radius: 24px;
            color: transparent;
        }
        .search-ghost .ghost-suffix { color: #9aa0a6; font-weight: 400; }
        .suggest-rest { color: var(--primary); font-weight: 600; }
        .suggestions li.active, #suggestions-list li.active, #top-suggestions-list li.active {
            background: var(--primary-light);
        }
        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 12px 12px;
            text-align: left;
            list-style: none;
            padding: 0;
            margin: 0;
            display: none;
            z-index: 10;
            box-shadow: var(--shadow);
        }
        .suggestions li {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid #f1f3f4;
            font-size: 14px;
        }
        .suggestions li:last-child { border-bottom: none; }
        .suggestions li:hover { background: var(--primary-light); }
        .suggest-tag {
            display: inline-block;
            font-size: 11px;
            padding: 1px 6px;
            margin-right: 6px;
            border-radius: 4px;
            background: var(--primary-light);
            color: var(--primary);
        }
        .suggest-correct { color: var(--accent); font-weight: 500; }
    </style>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="site-logo">
            <span class="site-logo-mark">NKU</span>
            <span>信息检索系统</span>
        </a>
        <div id="auth-section"></div>
    </header>

    <main class="home-main">
        <h1 class="home-title">NKU 信息检索</h1>
        <p class="home-subtitle">南开大学站内网页 · 个性化排序 · 网页快照</p>
        <div class="search-panel">
            <div class="search-box">
                <div class="search-input-wrapper">
                    <div id="search-ghost" class="search-ghost" aria-hidden="true"></div>
                    <input type="text" id="search-input" class="search-input" placeholder="输入检索内容..." autocomplete="off" spellcheck="false">
                    <ul id="suggestions-list" class="suggestions"></ul>
                </div>
                <button type="button" id="search-btn" class="btn btn-primary">检索</button>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api_client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin_auth.js"></script>
    <script src="js/auth_ui.js"></script>
    <script src="js/query_suggest.js"></script>
    <script src="js/suggest_bind.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
