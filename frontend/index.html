<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南开大学信息检索系统</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
        .header { display: flex; justify-content: flex-end; padding: 10px; }
        .search-container { margin-top: 15vh; position: relative; display: inline-block; }
        .search-box { display: flex; align-items: center; gap: 10px; }
        .search-input { width: 400px; padding: 10px; font-size: 16px; }
        .search-btn { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        .suggestions { 
            position: absolute; top: 100%; left: 0; width: 400px; 
            background: #fff; border: 1px solid #ccc; border-top: none; 
            text-align: left; list-style: none; padding: 0; margin: 0; display: none; z-index: 10;
        }
        .suggestions li { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        .suggestions li:hover { background: #f5f5f5; }
    </style>
</head>
<body>
    <div class="header" id="auth-section">
        </div>

    <div class="search-container">
        <h1>信息检索系统</h1>
        <div class="search-box">
            <select id="search-type" style="padding: 10px;">
                <option value="site">站内查询</option>
                <option value="phrase">短语查询</option>
                <option value="wildcard">通配查询</option>
                <option value="document">文档查询 (doc/pdf/xls)</option>
            </select>
            
            <div style="position: relative;">
                <input type="text" id="search-input" class="search-input" placeholder="输入检索内容..." autocomplete="off">
                <ul id="suggestions-list" class="suggestions"></ul>
            </div>
            
            <button id="search-btn" class="search-btn">检索</button>
        </div>
    </div>

    <script src="js/api_client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
