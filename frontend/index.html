<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南开大学信息检索系统</title>
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .home-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 70px);
            padding: 40px 20px;
        }
        .home-title {
            font-size: 42px;
            font-weight: 700;
            color: var(--primary);
            margin: 0 0 8px;
            letter-spacing: 1px;
        }
        .home-subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 36px;
        }
        .search-panel {
            background: var(--card);
            padding: 28px 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 720px;
        }
        .search-box {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }
        .search-box select {
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: var(--card);
            color: var(--text);
        }
        .search-input-wrapper { position: relative; flex: 1; min-width: 280px; }
        .search-input-wrapper .search-input { width: 100%; }
        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 12px 12px;
            text-align: left;
            list-style: none;
            padding: 0;
            margin: 0;
            display: none;
            z-index: 10;
            box-shadow: var(--shadow);
        }
        .suggestions li {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid #f1f3f4;
            font-size: 14px;
        }
        .suggestions li:last-child { border-bottom: none; }
        .suggestions li:hover { background: var(--primary-light); }
    </style>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="site-logo">
            <span class="site-logo-mark">NKU</span>
            <span>信息检索系统</span>
        </a>
        <div id="auth-section"></div>
    </header>

    <main class="home-main">
        <h1 class="home-title">NKU 信息检索</h1>
        <p class="home-subtitle">南开大学站内网页 · 个性化排序 · 网页快照</p>
        <div class="search-panel">
            <div class="search-box">
                <select id="search-type">
                    <option value="site">站内查询</option>
                    <option value="phrase">短语查询</option>
                    <option value="wildcard">通配查询</option>
                    <option value="document">文档查询</option>
                </select>
                <div class="search-input-wrapper">
                    <input type="text" id="search-input" class="search-input" placeholder="输入检索内容..." autocomplete="off">
                    <ul id="suggestions-list" class="suggestions"></ul>
                </div>
                <button type="button" id="search-btn" class="btn btn-primary">检索</button>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api_client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/auth_ui.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
