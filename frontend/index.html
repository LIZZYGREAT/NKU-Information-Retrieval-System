<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南开大学信息检索系统</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; text-align: center; color: #333;}
        .header { display: flex; justify-content: flex-end; padding: 10px; }
        .search-container { margin-top: 20vh; position: relative; display: inline-block; }
        h1 { font-size: 36px; color: #202124; margin-bottom: 30px; }
        
        .search-box { display: flex; align-items: center; gap: 10px; justify-content: center;}
        select { padding: 10px; font-size: 16px; border: 1px solid #dfe1e5; border-radius: 4px; outline: none; }
        
        .search-input-wrapper { position: relative; }
        .search-input { width: 500px; padding: 12px 20px; font-size: 16px; border: 1px solid #dfe1e5; border-radius: 24px; outline: none; }
        .search-input:focus { box-shadow: 0 1px 6px rgba(32,33,36,.28); border-color: transparent;}
        
        .search-btn { padding: 10px 24px; font-size: 16px; cursor: pointer; background-color: #f8f9fa; border: 1px solid #f8f9fa; border-radius: 4px; color: #3c4043;}
        .search-btn:hover { border: 1px solid #dadce0; box-shadow: 0 1px 1px rgba(0,0,0,.1); }
        
        .suggestions { 
            position: absolute; top: 100%; left: 0; width: 100%; 
            background: #fff; border: 1px solid #ccc; border-top: none; border-radius: 0 0 10px 10px;
            text-align: left; list-style: none; padding: 0; margin: 0; display: none; z-index: 10;
            box-shadow: 0 4px 6px rgba(32,33,36,.28);
        }
        .suggestions li { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #eee; }
        .suggestions li:last-child { border-bottom: none; }
        .suggestions li:hover { background: #f5f5f5; }
    </style>
</head>
<body>
    <div class="header" id="auth-section">
        </div>

    <div class="search-container">
        <h1>NKU 信息检索系统</h1>
        <div class="search-box">
            <select id="search-type">
                <option value="site">站内查询</option>
                <option value="phrase">短语查询</option>
                <option value="wildcard">通配查询</option>
                <option value="document">文档查询 (doc/pdf/xls)</option>
            </select>
            
            <div class="search-input-wrapper">
                <input type="text" id="search-input" class="search-input" placeholder="输入检索内容..." autocomplete="off">
                <ul id="suggestions-list" class="suggestions"></ul>
            </div>
            
            <button id="search-btn" class="search-btn">检索</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api_client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/auth_ui.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
