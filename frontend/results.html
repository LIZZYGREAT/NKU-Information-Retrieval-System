<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果 - 南开大学信息检索系统</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/results.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="site-logo">
            <span class="site-logo-mark">NKU</span>
            <span>信息检索系统</span>
        </a>
        <div id="auth-section"></div>
    </header>

    <main class="results-page">
        <div class="results-toolbar">
            <div class="search-input-wrap">
                <div id="top-search-ghost" class="search-ghost" aria-hidden="true"></div>
                <input type="text" id="top-search-input" class="search-input" placeholder="输入检索内容..." autocomplete="off" spellcheck="false">
                <ul id="top-suggestions-list" class="suggestions"></ul>
            </div>
            <button type="button" id="top-search-btn" class="btn btn-primary">重新检索</button>
            <a href="index.html" class="btn">返回首页</a>
        </div>

        <div id="result-stats"></div>
        <div id="results-container"></div>
        <div id="pagination-container"></div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api_client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/auth_ui.js"></script>
    <script src="js/query_suggest.js"></script>
    <script src="js/suggest_bind.js"></script>
    <script src="js/results.js"></script>
</body>
</html>
