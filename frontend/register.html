<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - NKU 信息检索系统</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <a href="index.html" class="auth-back">← 返回首页</a>
    <div class="auth-card">
        <h1>用户注册</h1>
        <div id="error-msg" class="auth-error"></div>
        <form id="register-form">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" required autocomplete="username">

            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" required autocomplete="email">

            <label for="password">密码</label>
            <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">

            <label for="password2">确认密码</label>
            <input type="password" id="password2" name="password2" required minlength="6" autocomplete="new-password">

            <button type="submit" class="btn-primary" id="submit-btn">注册</button>
        </form>
        <div class="auth-footer">
            已有账号？<a href="login.html">去登录</a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api_client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
